# CI cho dashboard quản trị (Next.js). Thứ tự: quick-checks → (E2E ∥ Claude review).
# Railway chỉ deploy `main` khi các check này xanh (bật "Wait for CI" ở service Railway).
name: CI

on:
  pull_request:
  push:
    branches: [main, "hieufeature_**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quick-checks:
    name: Format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, fake API)
    needs: quick-checks
    # Ubuntu 26 runners fail to fetch Playwright system fonts (F38); pin until fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # API giả trong tests/fixture-api.mjs — không gọi API thật, không cần secret.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  claude-review:
    name: Claude code review
    needs: quick-checks
    # Repo đang public: PR từ fork không nhận secret, nên chỉ chạy cho PR từ chính repo.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for Claude credentials
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Ưu tiên token gói Claude Pro/Max (không tính phí thêm, dùng chung hạn mức gói); API key là dự phòng.
          if [ -n "$OAUTH" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "plan=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Chưa có CLAUDE_CODE_OAUTH_TOKEN hoặc ANTHROPIC_API_KEY — bỏ qua Claude review."; fi
      - name: Detect sensitive paths
        id: paths
        if: steps.key.outputs.ok == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PLAN: ${{ steps.key.outputs.plan }}
        run: |
          # Phiên đăng nhập, proxy và cổng gọi API: review kỹ hơn bằng model mạnh hơn.
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^src/(proxy\.ts|lib/server/|lib/session|lib/access-policy|lib/backend-client|app/api/)'; then
            # Gói Pro: Sonnet + effort cao để không tiêu hết hạn mức; API key: Opus.
            if [ "$PLAN" = "true" ]; then echo "args=--model claude-sonnet-5-5 --effort high" >> "$GITHUB_OUTPUT"
            else echo "args=--model claude-opus-5-5 --effort high" >> "$GITHUB_OUTPUT"; fi
          else
            echo "args=--model claude-sonnet-5-5" >> "$GITHUB_OUTPUT"
          fi
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Chỉ dùng API key (tính phí theo token) khi chưa có token gói Claude Pro/Max.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            Focus on auth/session security (HttpOnly SameSite=Strict cookies, no tokens in JSON or browser JS,
            CSRF origin checks) and Next.js 16 conventions. Write review comments in Vietnamese.
          claude_args: >-
            ${{ steps.paths.outputs.args }} --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
